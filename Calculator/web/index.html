<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Stack Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
<main class="calculator" aria-labelledby="calculator-title">
    <h1 id="calculator-title">Stack Calculator</h1>
    <p class="subtitle">JavaScript input with Java PEMDAS evaluation</p>

    <label class="screen-label" for="display">Expression</label>
    <input id="display" class="display" type="text" value="0" readonly>
    <p id="status" class="status" aria-live="polite"></p>

    <section id="buttons" class="buttons" aria-label="Calculator buttons">
        <button class="utility span-two" data-action="clear">Clear</button>
        <button class="utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="operator" data-action="operator" data-value="/">÷</button>

        <button data-action="number" data-value="7">7</button>
        <button data-action="number" data-value="8">8</button>
        <button data-action="number" data-value="9">9</button>
        <button class="operator" data-action="operator" data-value="*">×</button>

        <button data-action="number" data-value="4">4</button>
        <button data-action="number" data-value="5">5</button>
        <button data-action="number" data-value="6">6</button>
        <button class="operator" data-action="operator" data-value="-">−</button>

        <button data-action="number" data-value="1">1</button>
        <button data-action="number" data-value="2">2</button>
        <button data-action="number" data-value="3">3</button>
        <button class="operator" data-action="operator" data-value="+">+</button>

        <button class="span-two" data-action="number" data-value="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="calculate">=</button>
    </section>
</main>
</body>
</html>
